<body class="auth-page"><main class="auth-shell"><div class="auth-orbit auth-orbit-one"></div><div class="auth-orbit auth-orbit-two"></div><section class="auth-card"><a class="brand-lockup" href="index.html"><span class="brand-mark">i<span>B</span></span><span class="brand-name">inBestmen</span></a><div class="auth-kicker">Join the global signal</div><h1>Create your inBestmen account.</h1><p class="auth-copy">Build your personal constellation of projects, iB Coins and ideas that deserve to move forward.</p><form id="registerForm" class="auth-form"><label for="registerName">Your name</label><input id="registerName" type="text" autocomplete="name" placeholder="Your full name" required><label for="registerEmail">Email address</label><input id="registerEmail" type="email" autocomplete="email" placeholder="you@example.com" required><label for="registerPassword">Password</label><input id="registerPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required><button class="btn btn-primary w-100" type="submit">Create my account <span>→</span></button></form><p id="accountStatus" class="auth-status" role="status"></p><p class="auth-footnote">Already a member? <a href="auth.html">Sign in</a> · <a href="forgot-password.html">Forgot password?</a></p><p class="auth-legal">By creating an account, you agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p></section></main><script src="js/firebase-config.js"></script><script type="module" src="js/account.js"></script></body></html>
